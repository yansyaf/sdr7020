  <text x="1174" y="222" fill="#f87171" font-size="7.5">separate PSU · star ground · ferrite on every motor lead</text>
  <text x="1174" y="236" fill="#f87171" font-size="7.5">common-mode noise here destroys the noise floor</text>
  <text x="1174" y="256" fill="#94a3b8" font-size="8">microstep: 200 steps/rev × 16 = 3200</text>

  <text x="396" y="602" fill="#94a3b8" font-size="8.5">S21: TX1 → DUT → RX1 (through the antenna pair)</text>

  <text x="396" y="634" fill="#94a3b8" font-size="8.5">S11: TX1 → coupler → DUT, coupled port → RX1</text>

  <!-- Sync panel -->
  <rect x="850" y="540" width="698" height="300" rx="8" fill="#0f172a"/>
  <rect x="850" y="540" width="698" height="300" rx="8" fill="rgba(136,19,55,0.16)" stroke="#fb7185" stroke-width="1.4" stroke-dasharray="4,4"/>
  <text x="868" y="564" fill="#fecdd3" font-size="12" font-weight="600">Synchronisation: three options, in order of effort</text>

  <text x="868" y="590" fill="#34d399" font-size="9.5" font-weight="600">C · software handshake — works today, no wiring</text>
  <text x="884" y="606" fill="#94a3b8" font-size="8.5">G1 → poll "?" until &lt;Idle&gt; → dwell 250 ms → capture → CSV row</text>
  <text x="884" y="620" fill="#64748b" font-size="8">scan_rig.py implements this. ~0.4 s per point. Position known, capture clean.</text>

  <text x="868" y="646" fill="#fb7185" font-size="9.5" font-weight="600">A · GRBL drives the SDR (hardware trigger)</text>
  <text x="884" y="662" fill="#94a3b8" font-size="8.5">M8/M9 (spindle/coolant out) → 4N35 or 6N137 opto → header 3.3V IO pin</text>
  <text x="884" y="676" fill="#94a3b8" font-size="8.5">→ PL trigger on the ADC core / DMA start → capture starts on the edge</text>
  <text x="884" y="690" fill="#f87171" font-size="8">needs custom HDL (firmware/): a triggered buffer start. Never wire 5 V into an FPGA pin.</text>

  <text x="868" y="716" fill="#a78bfa" font-size="9.5" font-weight="600">B · SDR marks the window (for the motion side)</text>
  <text x="884" y="732" fill="#94a3b8" font-size="8.5">PTT OUT (5 V) → 10k/20k divider → GRBL probe input, or → MCU interrupt</text>
  <text x="884" y="746" fill="#94a3b8" font-size="8.5">lets the machine know a capture window opened; PTT is TX-enable, so mind the PA</text>

  <text x="868" y="774" fill="#fbbf24" font-size="9.5" font-weight="600">RFIC SYNC IO is not a measurement trigger</text>
  <text x="884" y="790" fill="#94a3b8" font-size="8.5">it is the AD9361 SYNC_IN used to phase-lock the LOs of several chips (MIMO / multi-board).</text>
  <text x="884" y="804" fill="#94a3b8" font-size="8.5">Driving it from a motion controller will not start a capture — it will disturb the LO.</text>

  <text x="66" y="582" fill="#cbd5e1" font-size="10" font-weight="600">Why not the FPGA?</text>
  <text x="66" y="600" fill="#94a3b8" font-size="8">Zynq has 118 GPIO lines (906–1023),</text>
  <text x="66" y="614" fill="#94a3b8" font-size="8">Linux uses 3. Header brings out 2.</text>
  <text x="66" y="628" fill="#94a3b8" font-size="8">3 axes need 6 step/dir + 3 limits.</text>
  <text x="66" y="646" fill="#94a3b8" font-size="8">FPGA pins: 8–12 mA, 1.8/3.3 V —</text>
  <text x="66" y="660" fill="#94a3b8" font-size="8">buffer before any driver input.</text>
  <text x="66" y="678" fill="#6ee7b7" font-size="8">GRBL already does accel, homing,</text>
  <text x="66" y="692" fill="#6ee7b7" font-size="8">limits — for ~$30.</text>

  <text x="50" y="960" fill="#475569" font-size="8">Powering: motors 12–24 V separate PSU · GRBL 5 V from USB or its own supply · board 5 V/2 A on the DC jack · one star ground at the PSU negative.</text>
